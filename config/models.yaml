# Model and Provider Configurations
asr:
  provider: "faster_whisper" # options: mock, faster_whisper
  model: "base.en"
  device: "cuda"
  compute_type: "float16"
  beam_size: 1

vad:
  provider: "silero" # options: mock, silero
  model: "silero-vad"
  device: "cpu"
  threshold: 0.5

diarization:
  provider: "nemotron" # options: mock, nemotron, pyannote
  model: "Nemotron-3-Diarization-ONNX"
  device: "cpu"
  threshold: 0.35

sound_events:
  provider: "yamnet" # options: mock, yamnet
  model: "yamnet"
  device: "cpu"
  top_k: 5
  score_threshold: 0.15

acoustic:
  provider: "parselmouth" # options: mock, parselmouth
  pitch_floor_hz: 75.0
  pitch_ceiling_hz: 600.0

llm:
  provider: "vllm" # options: mock, tensorrt_llm, openai_compatible, ollama, llama_cpp
  model: "gemma4_4b"
  endpoint: "http://192.168.1.11:8001/v1"
  temperature: 0.5
  max_tokens: 384

tts:
  provider: "qwen" # options: kokoro, qwen, mock
  # For Qwen-TTS (vLLM endpoint):
  endpoint: "http://192.168.1.6:8091/v1"
  model: "Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice"
  task_type: "CustomVoice" # options: CustomVoice, VoiceDesign, Base
  voice: "ryan" # options: vivian, serena, ryan, eric, aiden, dylan, uncle_fu, ono_anna, sohee, default
  instructions: "A calm, friendly voice with clear articulation."
  # For Kokoro-TTS (local ONNX):
  # voice: "af_sarah" # options: af_sarah, af_bella, am_adam, am_michael, bf_emma
  # speed: 1.0
  # device: "cpu"



