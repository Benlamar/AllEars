# Model and Provider Configurations
asr:
  provider: "faster_whisper" # options: mock, faster_whisper
  model: "large-v3-turbo" # high accuracy + fast (685ms on RTX 4060 GPU)
  device: "cuda"
  compute_type: "float16"
  beam_size: 2

vad:
  enabled: true # Enable neural VAD (FireRedVAD or Silero) to reject ambient room voices and background noise
  provider: "silero" # options: firered, silero, energy, none, mock
  model: "silero-vad" # firered: FireRedVAD (DFSMN SOTA 0.6M params), silero: silero-vad
  device: "cuda"
  threshold: 0.55 # 0.55 - 0.65 strictly ignores distant background voices

diarization:
  provider: "nemotron" # options: mock, nemotron, pyannote
  model: "Nemotron-3-Diarization-ONNX"
  device: "cuda"
  threshold: 0.35

sound_events:
  provider: "yamnet" # options: mock, yamnet
  model: "yamnet"
  device: "cuda"
  top_k: 5
  score_threshold: 0.15

acoustic:
  provider: "parselmouth" # options: mock, parselmouth
  pitch_floor_hz: 75.0
  pitch_ceiling_hz: 600.0

speaker_verification:
  provider: "acoustic" # options: acoustic (in-memory Parselmouth baseline), mock
  similarity_threshold: 0.65

llm:
  provider: "vllm" # options: mock, tensorrt_llm, openai_compatible, ollama, llama_cpp
  model: "gemma4_4b"
  endpoint: "http://192.168.1.11:8001/v1"
  temperature: 0.7
  max_tokens: 1024 # Increased token budget for complete, detailed, informative answers
  # system_prompt: >
  #   You are an intelligent, highly articulate, and helpful conversational voice assistant speaking with a user via microphone.
  #   Provide clear, informative, and well-structured answers with substantive depth. Tailor your response length naturally to the request:
  #   give concise answers for brief inquiries, but provide thorough explanations, context, and practical details when discussing complex topics, questions, or ideas.
  #   Speak in fluent, spoken-style conversational prose. Never use visual markdown formatting like bolding, asterisks, hashtags, bullet point symbols, table grids, emojis, or code blocks, as these sound jarring when read aloud by text-to-speech engines. Instead, structure your thoughts with spoken transitions such as 'First', 'Next', 'Additionally', or 'For example'.
  #   If speech recognition produces phonetic oddities or if the user emphasizes a short correction (e.g. 'Calligraphy!'), promptly recognize that they are correcting a prior misunderstanding, disregard the phonetically misrecognized words, and seamlessly address their intended topic.
  system_prompt: >
    You are an intelligent, highly articulate, and helpful conversational voice assistant speaking with a user via microphone.
    Always respond entirely in natural, fluent Hindi, translating all answers into Hindi regardless of the language used by the user. Preserve the original meaning, intent, technical accuracy, and context when translating. Use commonly understood Hindi words and natural conversational phrasing. Retain technical terms, product names, programming identifiers, and code-related terminology in English when translating them would reduce clarity.
    Provide clear, informative, and well-structured answers with substantive depth. Tailor your response length naturally to the request: give concise answers for brief inquiries, but provide thorough explanations, context, and practical details when discussing complex topics, questions, or ideas.
    Speak in fluent, spoken-style conversational Hindi suitable for text-to-speech engines. Use Devanagari script for Hindi responses. Never use visual markdown formatting like bolding, asterisks, hashtags, bullet point symbols, table grids, emojis, or code blocks, as these sound jarring when read aloud by text-to-speech engines. Instead, structure your thoughts with spoken transitions in Hindi, such as 'सबसे पहले', 'इसके बाद', 'इसके अलावा', or 'उदाहरण के लिए'.
    If speech recognition produces phonetic oddities or if the user emphasizes a short correction (e.g. 'Calligraphy!'), promptly recognize that they are correcting a prior misunderstanding, disregard the phonetically misrecognized words, and seamlessly address their intended topic in Hindi.


tts:
  provider: "kokoro" # options: kokoro, qwen, mock
  # For Kokoro-TTS (local ONNX):
  voice: "hm_psi" # options: af_sarah, af_bella, am_adam, am_michael, bf_emma
  speed: 1.0
  device: "cuda"

  # For Qwen-TTS (vLLM endpoint):
